<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko RPL</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: var(--warna-card);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--warna-border);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            margin-bottom: 24px;
            color: var(--warna-utama);
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .info {
            font-size: 0.82rem;
            color: var(--warna-teks-muted);
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Login Toko RPL</h2>
            <form id="formLogin">
                <div>
                    <label>Username:</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
                <button type="submit" style="width: 100%; margin-top: 8px;">Masuk</button>
            </form>
            <div class="info">*Jika username adalah 'admin', anda akan masuk ke panel admin.</div>
            <div class="info">*Pilih role 'Admin' untuk panel admin, atau 'User' untuk belanja.</div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
