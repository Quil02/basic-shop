<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko RPL</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            margin-bottom: 20px;
            color: var(--warna-utama);
            text-align: center;
        }
        .info {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login Toko RPL</h2>
        <form id="formLogin">
            <div>
                <label>Username:</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div>
                <label>Password:</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit">Masuk</button>
        </form>
        <div class="info">*Jika username adalah 'admin', anda akan masuk ke panel admin.</div>
        <div class="info">*Pilih role 'Admin' untuk panel admin, atau 'User' untuk belanja.</div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
